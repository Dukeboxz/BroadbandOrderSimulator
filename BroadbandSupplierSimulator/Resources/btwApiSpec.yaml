            APIGW-Exception-System:
              $ref: '#/components/headers/ExceptionSystemOptional'
  /hubco/tmf/productOrderingManagement/v4/productOrder/notification:
    post:
      summary: Order status update
      operationId: hubcoProductOrderNotification
      description: >-
        <p>Details the notifications that BT Wholesale will POST back to your
        server as the order progresses.</p>

        <details>

        <summary><b>Sandbox responses</b></summary>


        <p>The sandbox supports a number of success and failure scenarios. Use
        the parameters below in the sandbox API call to generate the
        corresponding responses.</p>

        <p>Several example responses are simulated based on the
        APIGW-Tracking-Header proivded in the request header.</p>


        <details>

        <summary><b>Success scenarios</b></summary> 


        | APIGW-Tracking-Header | Sandbox response invoked| Description |

        | ----------- | ------------------- | ------------------ |      

        | PASS01 | 201 | Success response. |


        </details>


        </details>
