        '400':
          description: >-
            Bad Request


            | Code | Message | Description |

            | ---- | ------- | ----------- |

            | 21 | Missing body | This resource requires a body to be provided
            in the request. |

            | 22 | Invalid body | The body of the request does not conform to a
            standard and cannot be parsed. |

            | 25 | Missing header: \<parameter\> | The indicated parameter is
            missing from the request header. |

            | 23 | Missing body field | The field in the body of the request
            needs to be passed. |

            | 24 | Invalid body field | The field in the body of the request
            does not conform to a standard and cannot be parsed. |

            | 26 | Invalid header value: \<parameter\> | The indicated parameter
            in the request header is not recognized. |
                                    
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/failureResponse'
                  - $ref: '#/components/schemas/backendFailureResponse'
              examples:
                For APIGW error:
