            | 40 | Missing credentials | The <i>Authorization</i> parameter is
            missing. |

            | 41 | Invalid credentials / cugId passed in request is not
            authorized | The <i>Authorization</i> parameter is not valid or
            <i>cugId</i> authentication check fails. |

            | 42 | Expired credentials | Renew the access token using the OAuth
            API and try again. |
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failureResponse'
              example:
                code: '40'
                message: Missing credentials
          headers:
            APIGW-Exception:
