components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: This API requires [OAuth API](/node/360) validation.
      flows:
        clientCredentials:
          tokenUrl: >-
            https://api.platform.bt.com/oauth/accesstoken?grant_type=client_credentials
          scopes: {}
  parameters:
    APIGWTrackingHeader:
      name: APIGW-Tracking-Header
      in: header
      required: true
      description: >-
        A unique reference used to track the transaction end to end. The
        recommended format is UUID (a 36-character alphanumeric string
        "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX").
      schema:
        type: string
        example: 96bb97fa-b941-46bb-8c4e-86c616c28a13
        pattern: ^[\w.~:@-]{1,255}$
    BearerAuthorisation:
      name: Authorization
      in: header
      description: >-
        This contains the access token obtained from a call to the OAuth API.
        </br> The access token is prefixed with the word 'Bearer ' to form the
        authorisation string.
      schema:
        example: Bearer <token>
        type: string
    JSONContentType:
      name: Content-Type
      in: header
      description: The only supported format for the request body is 'application/json'.
      required: true
      schema:
        type: string
        example: application/json
    BearerAuthorisation-2:
      name: Authorization
      in: header
      required: false
      description: >-
        This contains the access token obtained from a call to the OAuth API.
        </br> The access token is prefixed with the word 'Bearer ' to form the
        authorization string.<br>'Azure token: The JWT token from consumer which
        will be passed to Azure public to retrieve public key against which
        token will be verified at APIGEE.  Once sharedflow validates the access
        token, a limited set of information is passed back to API from
        sharedflow. API then uses this information to further validate in API
        and pass it to downstream.'</br>
      schema:
        example: Bearer <token>
        type: string
    AcceptJSON:
      name: Accept
      in: header
      description: >-
        Specifies the response type of payload as json. The supported value is
        'application/json'.
      required: true
      schema:
        type: string
  schemas:
    BillingAccountRefs:
      required:
        - id
      type: object
      description: Detailed description of a bill structure.
      properties:
        id:
          type: string
          description: Unique identifier of the billing account.
        '@baseType':
          type: string
          description: >-
            Provides the base of the class of a given resource that has been
            extended.
        '@type':
          type: string
          description: Provides a way to represent the actual class type of an entity.
    BTNote:
      required:
        - text
      type: object
      properties:
        id:
          type: string
          description: >-
            Identifier of the note within its containing entity which may or may
            not be globally unique, depending on provider implementation.
        text:
          type: string
          description: Text of the note.
          maxLength: 3999
        '@baseType':
          type: string
          description: >-
            Provides the base of the class of a given resource that has been
            extended.
        '@type':
          type: string
          description: Provides a way to represent the actual class type of an entity.
        type:
          type: string
          description: Type of note.
    OrderItemActionType:
      type: string
      description: Action to be performed on the product.
      enum:
        - add
        - modify
        - delete
        - noChange
    BTAppointmentRef:
      required:
        - BESAppointmentId
        - appointmentStart
        - id
      type: object
      properties:
        id:
          type: string
          description: The identifier of the referred appointment.
        description:
          type: string
          description: An explanatory text regarding the appointment made with a party.
        '@baseType':
          type: string
          description: >-
            Provides the base of the class of a given resource that has been
            extended.
        '@type':
          type: string
          description: Provides a way to represent the actual class type of an entity.
        appointmentStart:
          type: string
          description: Appointment start date and time.
          format: YYYY-MM-DDThh:mm:ss
        appointmentFinish:
          type: string
          format: date-time
          description: BT extension.  Appointment finish date and time
        appointmentStatus:
          type: string
          description: BT extension.  Status of the appointment
        BESAppointmentId:
          type: string
          description: BT extension.  Appointment Id as recognised by the back-end systems
      description: Customer presentation or internal meeting or site visit.
    GeographicPoint:
      type: object
      properties:
        x:
          type: string
          description: x coordinate (usually latitude).
        'y':
          type: string
          description: y coordinate (usually longitude).
        z:
          type: string
          description: z coordinate (usually elevation).
      description: Defines a geographic point through coordinates.
    GeographicLocation:
      required:
        - accuracy
        - geometry
        - spatialRef
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of a geo location.
        name:
          type: string
          description: Name of a geo location.
        geometryType:
          type: string
          description: >-
            Type allows describing geo location form, it could be a point, a
            line, a polygon, a cylinder etc.
        accuracy:
          type: string
          description: Accuracy of geo location.
        spatialRef:
          type: string
          description: Geocoding referential.
        geometry:
          $ref: '#/components/schemas/GeographicPoint'
      description: Describe through coordinate(s) a point, a line or a space.
    GeographicSubAddress:
      type: object
      properties:
        id:
          type: string
          description: Unique Identifier of the sub address.
        name:
          type: string
          description: >-
            Name of the sub address to identify it with a meaningful
            identification.
        subUnitType:
          type: string
          description: >-
            The type of subunit (e.g. 'BERTH', 'FLAT', 'PIER', 'SUITE', 'SHOP',
            'TOWER', 'UNIT', 'WHARF').
        subUnitNumber:
          type: string
          description: >-
            The discriminator used for the subunit often just a simple number
            (e.g. FLAT 5, may also be a range).
        levelType:
          type: string
          description: Describes level types within a building.
        levelNumber:
          type: string
          description: >-
            Used where a level type may be repeated (e.g. BASEMENT 1, BASEMENT
            2).
        buildingName:
          type: string
          description: Allows for buildings that have well known names.
        privateStreetNumber:
          type: string
          description: Private streets number internal to a private street.
        privateStreetName:
          type: string
          description: >-
            Private streets internal to a property (e.g. a university) may have
            internal names that are not recorded by the land title office.
      description: >-
        It is used for addressing within a property in an urban area (country
        properties are often defined differently). It may refer to a building, a
        building cluster, or a floor of a multistory building.
    GeographicAddress:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the address.
        matchedId:
          type: string
          description: Matching Nad key.
        addressMatch:
          type: boolean
          description: >-
            Boolean field to indicate whether the Openreach and ROBT address are
            matched.
        uprn:
          type: string
          description: Unique property Reference Number.
        parentUPRN:
          type: string
          description: Parent UPRN.
        addressSource:
          type: string
          description: source either 'ROBT NAD'/'OR NAD'.
        exchangeGroupCode:
          type: string
          description: Identifies the serving exchange for the address.
        districtCode:
          type: string
          description: >-
            A unique code representing the Openreach district (region) for the
            address. Only returned for "Gold" addresses.
        qualifier:
          type: string
          description: >-
            The Address Qualifier which indicates where the address was found.
            Possible values are Gold (held on Openreach database) or Silver
            (held on PAF, Address Base Premium and Pointer).
        streetNr:
          type: string
          description: >-
            Number identifying a specific property on a public street. It may be
            combined with streetNrLast for ranged addresses.
        streetNrSuffix:
          type: string
          description: The first street number suffix.
        streetNrLast:
          type: string
