openapi: 3.0.0
info:
  title: Order Management And Progress Updates
  description: >-
    Submit, amend or cancel an order, and receive notifications about the order
    status. This API is based on TMF622.
  version: '0.5'
servers:
  - url: https://api.wholesale.bt.com
    description: Production
  - url: https://api-sandbox.wholesale.bt.com
    description: Sandbox
paths:
  /hubco/tmf/productOrderingManagement/v4/productOrder:
    post:
      summary: Product order
      operationId: hubcoProductOrder
      description: >-
        <p>Submit an order to BT Wholesale. This order will contain all relevant
        elements e.g. service being provided, appointments and CPE to be
        provided. This API is based on TMF622.</p> <p>This API supports TLS
        mutual authentication.</p>

        <details>

        <summary><b>Sandbox responses</b></summary>

        <p>The sandbox supports a number of success and failure scenarios. Use
        the parameters below in the sandbox API call to generate the
        corresponding responses.</p> <p>Several example responses are simulated
        based on the APIGW-Tracking-Header proivded in the request header.</p>


        <details>

        <summary><b>Success scenarios</b></summary>    


        | APIGW-Tracking-Header | Sandbox response invoked | Description |

        | ------- | -------- | -------- |

        | PASS01 | 202 | Success response. |


        </details>

        <details>

        <summary><b>Error scenarios</b></summary>    


        | APIGW-Tracking-Header | Sandbox response invoked | Description |

        | ------- | -------- | -------- |

        | E00300 | 400, 25 | Missing header. |

        | E00200 | 500, 01 | Unable to handle request due to an Internal error.
        |

        | E00400 | 503, 05 | The Service is temporarily unavailable. |




        </details> </details>
