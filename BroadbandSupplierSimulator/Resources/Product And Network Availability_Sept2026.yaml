openapi: 3.0.0
info:
  title: Product And Network Availability
  description: >-
    Determine the services available at customer's location and the status of
    the existing installed services.
  version: '0.9'
servers:
  - url: https://api.wholesale.bt.com
    description: Production
  - url: https://api-sandbox.wholesale.bt.com
    description: Sandbox
paths:
  /hubco/tmf/productOfferingQualification/v4/productOfferingQualification:
    post:
      summary: Product availability
      operationId: createHubcoProductOfferingQualification
      description: >-
        <p>Product offering qualification is created based on a product offers
        that

        are defined in a catalog.</p>

        <p>This API supports TLS mutual authentication.</p>

        <details>

        <summary><b>Sandbox responses</b></summary>


        <p>The sandbox supports a number of success and failure scenarios. Use
        the parameters below in the sandbox API call to generate the
        corresponding responses.</p>

        <p>Several example responses are simulated based on the
        APIGW-Tracking-Header proivded in the request header.</p>


        <details>

        <summary><b>Success scenarios</b></summary> 


        | APIGW-Tracking-Header | Response details | Description |

        | ----------- | ------------------- | ------------------ |      

        | PASS01 | 200 | Sync Success response. |

        | PASS02 | 200 | Async Success response. |


        </details>


        </details>
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >
            curl -XPOST

            -H "APIGW-Tracking-Header: 96bb97fa-b941-46bb-8c4e-86c616c28a13"

            -H "Authorization: Bearer SZrYQsmi9tvGj1XwmKr5lXD4dpXY" 

            -H "Content-Type: application/json"

            https://api-sandbox.wholesale.bt.com/hubco/tmf/productOfferingQualification/v4/productOfferingQualification            

            {
                "@type": "btProductOfferingQualification",
                "instantSyncQualification": true,
                "productOfferingQualificationItem": [
                    {
                        "id": "74",
                        "action": "add",
                        "product": {
                            "@type": "Product",
                            "productOffering": {
                                "id": "BroadbandOne",
                                "@referredType": "btProductOfferingFamily"
                            },
                            "place": [
                                {
                                    "id": "A99923776374",
                                    "districtId": "LS",
                                    "role": "install address",
                                    "@referredType": "btNADLocationReference"
                                }
                            ]
                        },
                        "@type": "btProductOfferingQualificationItem"
                    }
                ],
                "provideAlternative": true,
                "provideOnlyAvailable": false,
                "provideUnavailabilityReason": false,
                "relatedParty": [
                    {
                        "id": "CUG5023769999",
                        "role": "BtCug",
                        "@type": "BTRelatedParty",
                        "@referredType": "Customer"
                    }
                ]
            }
      security:
        - OAuth2: []
      parameters:
        - $ref: '#/components/parameters/APIGWTrackingHeader'
        - $ref: '#/components/parameters/BearerAuthorisation'
        - $ref: '#/components/parameters/JSONContentType'
