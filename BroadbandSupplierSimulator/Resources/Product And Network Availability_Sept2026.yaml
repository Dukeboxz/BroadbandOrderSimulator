  /v1/line-availability/line:
    get:
      summary: Address line availability
      operationId: getAddressLineAvailability
      description: >-
        <p>Line availability of working & stopped lines for a specific location
        address or DN.</p>

        <details> <summary><b>Sandbox responses</b></summary>
         <p>The sandbox supports a number of success and failure scenarios which can be simulated by changing the last 6 characters of the APIGW-Tracking-Header as defined in the tables below.</p>


        <details>

        <summary><b>Success scenarios</b></summary>    


        | APIGW-Tracking-Header | Sandbox response invoked | Description |

        | ------- | -------- | -------- |

        | PASS01 | 200 | Fetch stopped and working lines for specific location.
        |

        | PASS02 | 200 | Address match not found. |


        </details>

        <details>

        <summary><b>Error scenarios</b></summary>    


        | APIGW-Tracking-Header | Sandbox response invoked | Description |

        | ------- | -------- | -------- |

        | E10001 | 500, 100 | General resource error. |

        | E00501 | 503, 05 | The service is temporarily unavailable. |

        </details> </details>
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >
            curl -XGET

            -H "APIGW-Tracking-Header: 96bb97fa-b941-46bb-8c4e-86c616c28a13"

            -H "Authorization: Bearer SZrYQsmi9tvGj1XwmKr5lXD4dpXY"

            -H "Destination-System: XMLGW"

            https://api-sandbox.wholesale.bt.com/v1/line-availability/line?districtCode=ND&NAD=A90000409574
      security:
        - OAuth2: []
      parameters:
        - $ref: '#/components/parameters/APIGWTrackingHeader'
        - $ref: '#/components/parameters/BearerAuthorisation-2'
        - $ref: '#/components/parameters/DUNSID'
        - $ref: '#/components/parameters/districtCode'
        - $ref: '#/components/parameters/NAD'
        - $ref: '#/components/parameters/installationDN'
        - $ref: '#/components/parameters/retentionCLI'
        - $ref: '#/components/parameters/Destination-System'
      responses:
        '200':
          description: |
            <p>OK</p>   
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAddressLineAvailabilityResponse'
              examples:
                For success MLPA:
                  value:
                    LineAvailability:
                      ExchangeGroupCode: CLPM
                      MDFSiteId: LSCLPM
                      ResultsTruncatedFlag: 'N'
                      DesignDP: 1247
                      DPSparePairs: 2
                      DPType: External
                      StoppedLineQty: 1
                      WorkingLineQty: 2
                      FTTPPriorityExchange: 'N'
                      WLRWithdrawal: 'N'
                      MPFRestriction: 'N'
                      SOTAPRestriction: 'N'
                      ListOfStoppedLine:
                        - ServiceId: '02086736797'
                          AccessLineId: C000025458714
                          LastWorkingPartialDN: 11
                          StoppedDate: '2023-01-05'
                          ProductType: PSTN
                          NTEFaceplateTypeRecorded: STANDARD
                          NTETypeRecorded: NTE5C
                          NTELocationRecorded: '|RECEPTION|'
                          DateNTEDetailsRecorded: '2018-09-11'
                          InstallationType: Standard
                          ExchangeGroupCode: CLPM
                          CSSExchangeType: DXD03
                          MDFSiteId: LSCLPM
                      ListOfWorkingLine:
                        - AccessLineId: C000019497559
                          PartialDN: 70
                          NumberRetentionAllowed: 'Y'
                          ProductType: PSTN Single Line
                          PendingCeaseOrderIndicator: 'N'
                          InstallationType: Standard
                          ExchangeGroupCode: CLPM
                          CSSExchangeType: DXD03
                          MDFSiteId: LSCLPM
                        - AccessLineId: UUB0089636U9
