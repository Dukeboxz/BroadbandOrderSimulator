          description: Identifies the default exchange for the address.
          example: EMTOWCE
    ListOfWorkingLine:
      type: object
      properties:
        ServiceId:
          type: string
          description: Indicates service ID for the working line.
          example: LLEM2405756
        AccessLineId:
          type: string
          description: Virtual ID to identify the underlying bearer supporting the service.
          example: OHP5738089O3
        PartialDN:
          type: string
          description: The last x digits of the telephone number for the working line.
          example: BTRC
        NumberRetentionAllowed:
          type: string
          description: >-
            Indicates whether the DN associated with the working line is
            available for takeover.
          example: 'Y'
        ProductType:
          type: string
          description: Product present in the installation.
          example: MPF
        PendingCeaseOrderIndicator:
          type: string
          description: >-
            Indication of whether a cease or stop order is currently open
            against the service.
          example: 'N'
        PendingCeaseCompletionDate:
          type: string
          description: Date
          example: '2022-03-07T17:32:28Z'
        WorkingLineLocation:
          type: string
          description: >-
            This is a free text field which contains a description of the
            location of the line.
          example: DACS
        TechnologyType:
          type: string
          description: Technology type of working line.
          example: DACS
        TerminationType:
          type: string
          description: Termination type of working line.
          example: NTE
        NTEFaceplateTypeRecorded:
          type: string
          description: Faceplate type when NTE data recorded.
          example: DACS
        NTETypeRecorded:
          type: string
          description: Type when NTE data recorded.
          example: Type
        NTELocationRecorded:
          type: string
          description: Location when NTE data recorded.
          example: location
        DateNTEDetailsRecorded:
          type: string
          description: The Date when NTE data recorded.
          example: '2022-03-07T17:32:28Z'
        InstallationType:
          type: string
          description: >-
            It identifies the type of installation for which order is placed by
            CP.
          example: Standard
        ExchangeGroupCode:
          type: string
          description: >-
            Should be a valid ID, which identifies the exchange to which the DP
            is connected.
          example: TOWCE
        CSSExchangeType:
          type: string
          description: Name of the exchange for the installation.
          example: NDXD53
        MDFSiteId:
          type: string
          description: Identifies the default exchange for the address.
          example: EMTOWCE
    getAddressLineAvailabilityResponse:
      type: object
      required:
        - LineAvailability
        - MessageInfo
      properties:
        LineAvailability:
          type: object
          description: Contains line details.
          required:
            - ResultsTruncatedFlag
            - StoppedLineQty
            - WorkingLineQty
            - ListOfStoppedLine
            - ListOfWorkingLine
          properties:
            ExchangeGroupCode:
              type: string
              description: >-
                Should be a valid ID, which identifies the exchange to which the
                distribution point is connected.
              example: TOWCE
            MDFSiteId:
              type: string
              description: Identifies the default exchange for the address.
              example: EMTOWCE
            InstallationType:
              type: string
              description: It identifies the type of installation for the line.
              example: type
            ResultsTruncatedFlag:
              type: string
              description: >-
                Indicates if the site is too large to be fully characterized
                with this dialogue service and partial results are provided.
              example: 'N'
            DesignDP:
              type: integer
              description: The DP that is associated to an address.
              example: 787
            DPSparePairs:
              type: integer
              description: Number of spare pairs at this DP.
              example: 2
            DPType:
              type: string
              description: Indicates the type of distribution point.
              example: Internal
            StoppedLineQty:
              type: integer
              description: Total number of stopped lines.
              example: 1
            WorkingLineQty:
              type: integer
              description: Number of working lines at the address returned.
              example: 1
            RetentionOfCLIPossible:
              type: string
              description: If retention CLI entered can be served from the exchange.
              example: 'Y'
            FTTPPriorityExchange:
              type: string
              description: Indicates whether the exchange is upgraded for FTTP provision.
              example: 'Y'
            WLRWithdrawal:
              type: string
              description: Indicates whether WLR provision is restricted for the exchange.
              example: 'Y'
            MPFRestriction:
              type: string
              description: Indicates whether MPF provision is restricted for the exchange.
              example: 'N'
            SOTAPRestriction:
              type: string
              description: >-
                Indicates whether SOTAP provision is restricted for the
                exchange.
              example: 'N'
            ListOfStoppedLine:
              type: array
              description: List of stopped lines.
              items:
                $ref: '#/components/schemas/ListOfStoppedLine'
            ListOfWorkingLine:
              type: array
              description: List of working lines.
              items:
                $ref: '#/components/schemas/ListOfWorkingLine'
        MessageInfo:
          type: array
          description: Container for reject or sucess message.
          items:
            type: object
            required:
              - CompletionCode
              - Message
              - Severity
            properties:
              CompletionCode:
                type: integer
                description: Response code identifying the type of error.
                example: 2462
              Message:
                type: string
                description: Text of the error.
                example: >-
                  FULL InstallationType data can only be requested through the
                  B2B
              Severity:
                type: string
                description: <i>Severity</i> of the error.
                example: Warning
