    Product:
      type: object
      description: >-
        A <i>product</i> offering procured by a customer or other interested
        party playing a party role. A <i>product</i> is realized as one or more
        service(s) and / or resource(s).
      properties:
        id:
          type: string
          description: Unique identifier of the product.
        href:
          type: string
          description: Reference of the product.
        description:
          type: string
          description: Product <i>description</i>.
        isBundle:
          type: boolean
          description: >-
            If 'true', the product is a bundle product which is an instantiation
            of a bundled product offering. If 'false', the product is a
            component product, which is an instantiation of a simple product
            offering.
        isCustomerVisible:
          type: boolean
          description: If 'true', the product is visible by the customer.
        name:
          type: string
          description: >-
            Name of the product. It could be the same as the name of the product
            offering.
        orderDate:
          type: string
          description: Date when the product was ordered.
          format: YYYY-MM-DDThh:mm:ss
        productSerialNumber:
          type: string
          description: >-
            Is the serial number for the product. This is typically applicable
            to tangible products.
        startDate:
          type: string
          description: Date from which the product starts.
          format: YYYY-MM-DDThh:mm:ss
        terminationDate:
          type: string
          description: Is the date when the product was terminated.
          format: YYYY-MM-DDThh:mm:ss
        agreement:
          type: array
          description: >-
            Contract or arrangement, either written or verbal and sometimes
            enforceable by law, such as a service level <i>agreement</i> or a
            customer price <i>agreement</i>. It involves a number  of other
            business entities, such as products, services, and resources and/or
            their specifications.
          items:
            $ref: '#/components/schemas/AgreementItemRef'
        billingAccount:
          description: Detailed description of a bill structure.
          $ref: '#/components/schemas/BillingAccountRef'
        place:
          type: array
          description: Place reference where the products are sold or delivered.
          items:
            $ref: '#/components/schemas/btNADLocationReference'
        product:
          description: >-
            A <i>product</i> to be created defined by value or existing defined
            by reference.
          type: array
          items:
            $ref: '#/components/schemas/ProductRefOrValue'
        productCharacteristic:
          description: >-
            Describes a given characteristic of an entity through a name/value
            pair.
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'
        productOffering:
          description: >-
            Entities that are orderable from the provider of the catalog,  this
            resource includes pricing information.
          $ref: '#/components/schemas/ProductOfferingRef'
        productOrderItem:
          description: >-
            Product order item which triggered product
            creation/change/termination.
          type: array
          items:
            $ref: '#/components/schemas/RelatedProductOrderItem'
        productPrice:
          description: >-
            An amount, usually of money, that represents the actual price paid
            by a customer for a purchase, a rent or a lease of a product. The
            price is valid for a defined period of time.
          type: array
          items:
            $ref: '#/components/schemas/ProductPrice'
        productRelationship:
          description: Linked products to the one instantiate.
          type: array
          items:
            $ref: '#/components/schemas/ProductRelationship'
        productSpecification:
          description: >-
            Detailed description of a tangible or intangible item made available
            externally in the form of a product offering to customers or other
            parties playing a party role.
          $ref: '#/components/schemas/ProductSpecificationRef'
        productTerm:
          description: Commitment with a duration.
          type: array
          items:
            $ref: '#/components/schemas/ProductTerm'
        realizingResource:
          description: A list of resource references.
          type: array
          items:
            $ref: '#/components/schemas/btONTResourceRef'
        realizingService:
          description: Service reference, for when service is used by other entities.
          type: array
          items:
            $ref: '#/components/schemas/ServiceRef'
        relatedParty:
          description: Defines party or party role linked to a specific entity.
          type: array
          items:
            $ref: '#/components/schemas/RelatedParty'
        status:
          $ref: '#/components/schemas/ProductStatusType'
        '@baseType':
          type: string
          description: >-
