            | Code | Message | Description |

            | ---- | ------- | ----------- |

            | 21 | Missing body | This resource requires a body to be provided
            in the request. |

            | 22 | Invalid body | The body of the request does not conform to a
            standard and cannot be parsed. |

            | 25 | Missing header: \<parameter\> | The indicated parameter is
            missing from the request header. |

            | 26 | Invalid header value: \<parameter\> | The indicated parameter
            in the request header is not recognized. |

            | 102 | Set ‘provideOnlyAvailable’ to ‘true’. | Valid value for
            <I>provideOnlyAvailable</I> is true. |

            | 103 | Set ‘provideUnavailabilityReason’ to ‘false’. | Valid value
            for <I>provideUnavailabilityReason</I> is false. |

            | 104 | Invalid 'action' value. Only 'add' value is supported. |
            Invalid value supplied for <I>action</I>. |      

            | 105 | Invalid location data. Invalid format of 'place/id'
            attribute. | Invalid value supplied for <I>id</I>. |   

            | 106 | Invalid location data. Invalid format of 'place/districtId'
            attribute. | Invalid value supplied for <I>disctrictId</I>. |

            | 107 | Invalid location data. Unsupported 'role' value. Only
            'install address' is supported. | Invalid <I>role</I> value
            supplied. |        

            | 108 | Invalid location data. Unsuported type, please use
            'btNADLocationReference'. | Invalid location data supplied. |

            | 109 | Unsupported Product Offering value. | Invalid value supplied
            for product offering. |
                                    
